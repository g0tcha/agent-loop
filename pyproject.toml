[project]
name = "agent-loop"
version = "0.1.0"
description = "Building an AI agent from first principles with Python and the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
